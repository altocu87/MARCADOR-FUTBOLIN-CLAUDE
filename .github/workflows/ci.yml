# Pruebas en cada subida: app (tipos, pruebas, compilación) y firmware simulado en el PC.
name: Pruebas

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Chrome ya viene en la imagen ubuntu-latest; no descarga ni instala navegadores.
      - name: QR y sesiones con navegador aislado (nube ficticia)
        env:
          QR_BROWSER_CHANNEL: chrome
        run: |
          node scripts/test-qr-browser.mjs
          node scripts/test-session-browser.mjs
      - name: Firmware simulado (g++)
        run: npm run test:hardware

  instalador-sonidos:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalador USB con transporte ficticio (sin placa)
        shell: pwsh
        run: |
          ./tests/commentary-installer.test.ps1
      - name: Compilar instalador sin abrir puertos
        shell: pwsh
        run: |
          ./scripts/subir-comentarios.ps1 -CompileOnly
