# Diagnóstico de la conexión con Supabase (solo lectura, se lanza a mano desde Actions).
# Comprueba que la dirección, el Project ID y la clave pública son del mismo proyecto, cómo está la
# autenticación y el estado de las cuentas del equipo. No enseña claves ni contraseñas; los correos salen tapados.
name: Diagnóstico Supabase

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID || secrets.SUPABASE_PROJECT_ID }}
      SB_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
      SB_ANON: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configuración en GitHub
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD PROJECT_ID SB_URL SB_ANON; do
            if [ -n "${!v}" ]; then echo "✓ $v está puesto"; else echo "✗ FALTA $v"; fi
          done
          REF_URL=$(echo "$SB_URL" | sed -E 's#^https://([a-z0-9]+)\.supabase\.co/?$#\1#')
          if [ "$REF_URL" = "$PROJECT_ID" ]; then echo "✓ SUPABASE_URL y SUPABASE_PROJECT_ID son del mismo proyecto"
          else echo "✗ SUPABASE_URL NO coincide con SUPABASE_PROJECT_ID (o la URL no tiene la forma https://<id>.supabase.co)"; fi
          case "$SB_ANON" in
            eyJ*)
              P=$(echo "$SB_ANON" | cut -d. -f2 | tr '_-' '/+'); while [ $(( ${#P} % 4 )) -ne 0 ]; do P="$P="; done
              CLAIMS=$(echo "$P" | base64 -d 2>/dev/null)
              ROLE=$(echo "$CLAIMS" | jq -r .role); REF_KEY=$(echo "$CLAIMS" | jq -r .ref)
              [ "$ROLE" = "anon" ] && echo "✓ La clave es la «anon» (pública)" || echo "✗ La clave NO es la anon (rol: $ROLE). ¡Cámbiala!"
              [ "$REF_KEY" = "$PROJECT_ID" ] && echo "✓ La clave anon es de este proyecto" || echo "✗ La clave anon es de OTRO proyecto" ;;
            sb_publishable_*) echo "ℹ Clave «publishable» (se comprueba abajo contra el servidor)" ;;
            sb_secret_*) echo "✗ ¡Has puesto la clave SECRETA! Bórrala de GitHub y regenérala en Supabase" ;;
            *) echo "✗ La clave pública no tiene un formato conocido" ;;
          esac
      - name: Autenticación del proyecto (lo que ve la web)
        run: |
          CODE=$(curl -s -o /tmp/auth.json -w '%{http_code}' "$SB_URL/auth/v1/settings" -H "apikey: $SB_ANON")
          if [ "$CODE" = "200" ]; then
            echo "✓ La web puede hablar con Supabase con esa dirección y esa clave"
            echo "  Registro libre desactivado: $(jq -r .disable_signup /tmp/auth.json)"
            echo "  Correo con contraseña activado: $(jq -r .external.email /tmp/auth.json)"
            echo "  Confirmación automática de correo: $(jq -r .mailer_autoconfirm /tmp/auth.json)"
          else
            echo "✗ Supabase rechaza la dirección o la clave (HTTP $CODE)"
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Cuentas en la base de datos
        run: |
          supabase link --project-ref "$PROJECT_ID" --password "$SUPABASE_DB_PASSWORD" >/dev/null
          DB_URL=$(cat supabase/.temp/pooler-url)
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql "$DB_URL" -v ON_ERROR_STOP=1 -P pager=off -c "
            select regexp_replace(u.email, '^(.).*(@.*)$', '\1***\2') as correo,
                   coalesce(u.encrypted_password, '') <> '' as tiene_contrasena,
                   u.email_confirmed_at is not null as confirmado,
                   u.banned_until is not null as baneado,
                   p.role as rol,
                   p.bloqueado,
                   (select count(*) from auth.mfa_factors f where f.user_id = u.id and f.status = 'verified') as apps_2fa
            from auth.users u left join public.profiles p on p.id = u.id
            order by u.created_at;"
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql "$DB_URL" -P pager=off -c "select version as migracion from supabase_migrations.schema_migrations order by version;"
      - name: Datos de las mesas en la nube (mesa_datos)
        run: |
          DB_URL=$(cat supabase/.temp/pooler-url)
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql "$DB_URL" -P pager=off -c "
            select regexp_replace(u.email, '^(.).*(@.*)$', '\1***\2') as cuenta, d.tipo,
                   count(*) filter (where not d.borrado) as filas, count(*) filter (where d.borrado) as borradas,
                   max(d.actualizado) as ultimo_cambio
            from public.mesa_datos d join auth.users u on u.id = d.owner_id
            group by 1, 2 order by 1, 2;"
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql "$DB_URL" -P pager=off -c "
            select regexp_replace(u.email, '^(.).*(@.*)$', '\1***\2') as cuenta, d.datos->'config'->>'mode' as modo,
                   (d.datos->'result'->'score'->>'white') || '-' || (d.datos->'result'->'score'->>'blue') as resultado,
                   jsonb_array_length(d.datos->'participants') as jugadores, d.actualizado
            from public.mesa_datos d join auth.users u on u.id = d.owner_id
            where d.tipo = 'match' and not d.borrado order by d.actualizado desc limit 5;"
