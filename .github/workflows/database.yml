# Aplica las migraciones de supabase/migrations/ a la base de datos de Supabase.
# - Al subir a main (si cambia algo en supabase/migrations/) o a mano desde Actions: las aplica (db push).
# - En una pull request: solo enseña qué aplicaría (--dry-run), sin tocar nada.
# Necesita: variable SUPABASE_PROJECT_ID y secretos SUPABASE_ACCESS_TOKEN y SUPABASE_DB_PASSWORD (ver docs/ADMIN.md).
name: Base de datos

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/database.yml'
  pull_request:
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migraciones
  cancel-in-progress: false

jobs:
  migraciones:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: ¿Está configurado?
        id: listo
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$PROJECT_ID" ]; then
            echo "Falta SUPABASE_PROJECT_ID, SUPABASE_ACCESS_TOKEN o SUPABASE_DB_PASSWORD: no se aplica nada (ver docs/ADMIN.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.listo.outputs.ok == 'true'
        with:
          version: latest
      - name: Enlazar con el proyecto
        if: steps.listo.outputs.ok == 'true'
        run: supabase link --project-ref "$PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - name: Comprobar (pull request)
        if: steps.listo.outputs.ok == 'true' && github.event_name == 'pull_request'
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"
      - name: Aplicar migraciones
        if: steps.listo.outputs.ok == 'true' && github.event_name != 'pull_request'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
