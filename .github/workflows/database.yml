# Aplica las migraciones de supabase/migrations/ a la base de datos de Supabase y publica las funciones de
# supabase/functions/ (p. ej. vincular-placa, para entrar en la placa con un QR).
# - Al subir a main (si cambia algo en supabase/migrations/) o a mano desde Actions: las aplica (db push).
# - A mano con solo_qr=true: publica únicamente la función QR, sin enlazar ni aplicar migraciones.
# - En una pull request: solo enseña qué aplicaría (--dry-run), sin tocar nada.
# Necesita: variable SUPABASE_PROJECT_ID y secretos SUPABASE_ACCESS_TOKEN y SUPABASE_DB_PASSWORD (ver docs/ADMIN.md).
name: Base de datos

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - '.github/workflows/database.yml'
  pull_request:
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:
    inputs:
      solo_qr:
        description: 'Publicar solo vincular-placa (requiere migración QR ya aplicada; no ejecuta SQL)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: supabase-migraciones
  cancel-in-progress: false

jobs:
  migraciones:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SOLO_QR: ${{ github.event_name == 'workflow_dispatch' && inputs.solo_qr || false }}
      PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID || secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: ¿Está configurado?
        id: listo
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_ID" ] || { [ "$SOLO_QR" != "true" ] && [ -z "$SUPABASE_DB_PASSWORD" ]; }; then
            echo "Falta configuración de Supabase: proyecto y token; contraseña también si se aplican migraciones (ver docs/ADMIN.md)."
            exit 1
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.listo.outputs.ok == 'true'
        with:
          version: latest
      - name: Enlazar con el proyecto
        if: steps.listo.outputs.ok == 'true' && env.SOLO_QR != 'true'
        run: supabase link --project-ref "$PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - name: Comprobar (pull request)
        if: steps.listo.outputs.ok == 'true' && github.event_name == 'pull_request'
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"
      - name: Aplicar migraciones
        if: steps.listo.outputs.ok == 'true' && github.event_name != 'pull_request' && env.SOLO_QR != 'true'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Publicar las funciones (supabase/functions)
        if: steps.listo.outputs.ok == 'true' && github.event_name != 'pull_request'
        run: |
          if [ "$SOLO_QR" = "true" ]; then
            supabase functions deploy vincular-placa --project-ref "$PROJECT_ID" --use-api
            exit 0
          fi
          for f in supabase/functions/*/; do
            n=$(basename "$f")
            echo "Publicando $n"
            supabase functions deploy "$n" --project-ref "$PROJECT_ID" --use-api
          done
