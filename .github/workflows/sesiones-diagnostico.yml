# Solo GET a la configuración de Auth; no instala herramientas ni ejecuta SQL.
name: Diagnóstico de sesiones
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sesiones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Límites de acceso recordado (solo lectura)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID || secrets.SUPABASE_PROJECT_ID }}
        run: python3 scripts/check-auth-session-settings.py
