; Fase 3 (prueba): el mismo programa de la pantalla de 7" (Waveshare 7C), compilado con el mismo Arduino 3.3.12
; pero con una configuración propia de ESP-IDF (sdkconfig), la que recomienda Espressif para paneles RGB:
;   - el programa se ejecuta desde la PSRAM (XIP): escribir en la flash ya no para la PSRAM ni la pantalla;
;   - la interrupción del panel en IRAM (sigue viva mientras se escribe en la flash);
;   - el panel se realinea solo en cada retorno vertical;
;   - línea de caché de datos de 64 B (más ancho de banda de la PSRAM).
; pioarduino recompila las bibliotecas de Arduino con estos cambios la primera vez (tarda; luego queda en caché).
; Uso: pio run -d hardware/fase3   (el binario sale en hardware/fase3/.pio/build/waveshare7c/firmware.bin)

[platformio]
src_dir = ../esp32s3_pantalla7

[env:waveshare7c]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_upload.flash_size = 32MB
board_upload.maximum_size = 6291456
board_build.partitions = ../esp32s3_pantalla7/partitions.csv
; Bibliotecas desde GitHub (las mismas versiones que instala arduino-cli en firmware.yml).
lib_deps =
  https://github.com/lvgl/lvgl.git#v9.5.0
  https://github.com/lovyan03/LovyanGFX.git#1.2.34
  https://github.com/Links2004/arduinoWebSockets.git#2.7.2
build_flags =
  -DMFV3_BOARD=4
  -DMFV3_FASE3=1
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DLV_CONF_INCLUDE_SIMPLE
  -I../esp32s3_pantalla7
custom_sdkconfig =
  CONFIG_SPIRAM_XIP_FROM_PSRAM=y
  CONFIG_LCD_RGB_ISR_IRAM_SAFE=y
  CONFIG_LCD_RGB_RESTART_IN_VSYNC=y
  CONFIG_ESP32S3_DATA_CACHE_64KB=y
  CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
  CONFIG_SPIRAM_ALLOW_BSS_SEG_EXTERNAL_MEMORY=n
